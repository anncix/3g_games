{% extends "base_wap.html" %}

{% block title %}创建角色 · 小轩西游{% endblock %}

{% block breadcrumb %}
<div class="nav-bar">
    <a href="/home/">首页</a>
    <span class="sep">›</span>
    <a href="/games/xyou">小轩西游</a>
    <span class="sep">›</span>
    <span>创建角色</span>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/xyou.css">
{% endblock %}

{% block content %}
<div class="section">
    <div class="section-title">⛩️ 创建角色</div>
    <div class="section-body">
        {% if error %}
        <div class="xy-alert err">{{ error }}</div>
        {% endif %}
        <form method="post" action="/games/xyou/create">
            <div class="form-group">
                <label>角色名</label>
                <input type="text" name="name" maxlength="12" required placeholder="取个响亮的名字" value="{{ name or '' }}">
            </div>
            <div class="form-group">
                <label>出身（属性倾向）</label>
                {% for r in races %}
                <div style="border:1px solid #e0e8f4;border-radius:3px;padding:8px;margin-bottom:6px;">
                    <label style="display:flex;align-items:flex-start;cursor:pointer;">
                        <input type="radio" name="race" value="{{ r.name }}" style="width:auto;margin-right:8px;margin-top:2px;" {{ 'checked' if loop.first else '' }}>
                        <span>
                            <b>{{ r.name }}</b>
                            <span style="font-size:12px;color:#666;">{{ r.desc }}</span>
                        </span>
                    </label>
                </div>
                {% endfor %}
            </div>
            <div class="form-group">
                <label>职业</label>
                <select name="class_name">
                    {% for c in classes %}
                    <option value="{{ c.name }}">{{ c.name }}（{{ c.desc }}）</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>性别</label>
                <label style="margin-right:16px;"><input type="radio" name="sex" value="1" style="width:auto;" checked> 男</label>
                <label><input type="radio" name="sex" value="2" style="width:auto;"> 女</label>
            </div>
            <div class="text-center">
                <button type="submit" class="btn" style="padding:8px 30px;">⛩️ 出发西行</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
