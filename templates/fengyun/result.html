{% extends "base_wap.html" %}

{% block title %}操作结果 · 风云三国{% endblock %}

{% block breadcrumb %}
<div class="nav-bar">

    <span class="sep">›</span>
    <a href="/games/fengyun">风云三国</a>
    <span class="sep">›</span>

</div>
{% endblock %}

{% block content %}
<div class="section">
    <div class="section-title">{% if ok %}✅ 成功{% else %}❌ 失败{% endif %}</div>

    </div>

{% endblock %}
