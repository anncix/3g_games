{% extends "base_wap.html" %}
{% block title %}发帖 - 家园论坛{% endblock %}

{% block content %}
<div class="section">
    <div class="section-title">✏️ 发表新帖</div>
    <div class="section-body">
        <form method="post" action="/home/forum/topic/create">
            <div class="form-group">
                <label>选择版块</label>
                <select name="section_id" required>
                    {% for s in sections %}
                    <option value="{{ s.id }}" {% if current_section == s.id %}selected{% endif %}>{{ s.icon }} {{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>标题</label>
                <input type="text" name="title" required maxlength="50" placeholder="请输入标题">
            </div>
            <div class="form-group">
                <label>内容</label>
                <textarea name="content" rows="8" required placeholder="请输入帖子内容..."></textarea>
            </div>
            <div class="form-group" style="text-align: center;">
                <button type="submit" class="btn">发表帖子</button>
                <a href="/home/forum" class="btn" style="background: #999;">取消</a>
            </div>
        </form>
    </div>
</div>

<style>
.form-group {
    margin-bottom: 12px;
}
.form-group label {
    display: block;
    font-size: 13px;
    color: #333;
    margin-bottom: 5px;
    font-weight: bold;
}
.form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 3px;
    font-size: 13px;
    font-family: inherit;
}
.form-group textarea {
    resize: vertical;
}
</style>
{% endblock %}
