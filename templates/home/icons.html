{% extends "base_wap.html" %}
{% block title %}图标 - QQ家园{% endblock %}

{% block content %}
<div class="section">
    <div class="section-title">🏅 我的图标</div>
    <div class="section-body">
        <div style="background: #f0f4fa; padding: 8px; border-radius: 4px; font-size: 12px; margin-bottom: 10px;">
            已点亮: {{ lit_icon_ids|length }} / {{ all_icons|length }}
        </div>
        
        <div class="grid-4">
            {% for icon in all_icons %}
            <div class="icon-card {% if icon.id in lit_icon_ids %}lit{% else %}unlit{% endif %}">
                <div class="icon-emoji">{{ icon.icon }}</div>
                <div class="icon-name">{{ icon.name }}</div>
            </div>
            {% endfor %}
        </div>
        
        <div class="mt-10" style="text-align: center;">
            <a href="/home/" class="btn">返回首页</a>
            <a href="/home/achievements" class="btn">成就</a>
        </div>
    </div>
</div>

<style>
.grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}
.icon-card {
    text-align: center;
    padding: 10px 5px;
    border-radius: 4px;
    border: 1px solid #e0e8f4;
}
.icon-card.lit {
    background: linear-gradient(180deg, #fff8e8 0%, #fff0d0 100%);
    border-color: #ffd700;
}
.icon-card.unlit {
    background: #f5f5f5;
    opacity: 0.5;
}
.icon-emoji {
    font-size: 28px;
    filter: grayscale(100%);
}
.icon-card.lit .icon-emoji {
    filter: none;
}
.icon-name {
    font-size: 10px;
    margin-top: 4px;
    color: #666;
}
.icon-card.lit .icon-name {
    color: #333;
    font-weight: bold;
}
</style>
{% endblock %}
