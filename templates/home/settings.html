{% extends "base_wap.html" %}
{% block title %}个人设置{% endblock %}

{% block breadcrumb %}
<div class="nav-bar">
    <a href="/home/">首页</a>
    <span class="sep">›</span>
    <span>设置</span>
</div>
{% endblock %}

{% block content %}
<div class="section">
    <div class="section-title">⚙️ 个人设置</div>
    <div class="section-body">
        <form method="post" action="/home/settings/save">
            <div class="form-group">
                <label>昵称</label>
                <input type="text" name="nickname" value="{{ user.nickname or user.username }}" maxlength="20">
            </div>
            <div class="form-group">
                <label>个性签名</label>
                <textarea name="signature" maxlength="100">{{ user.signature }}</textarea>
            </div>
            <div class="form-group">
                <label>性别</label>
                <select name="gender">
                    <option value="secret" {% if user.gender == 'secret' %}selected{% endif %}>保密</option>
                    <option value="male" {% if user.gender == 'male' %}selected{% endif %}>男</option>
                    <option value="female" {% if user.gender == 'female' %}selected{% endif %}>女</option>
                </select>
            </div>
            <div class="form-group">
                <label>所在城市</label>
                <input type="text" name="city" value="{{ user.city or '' }}" placeholder="例如: 北京" maxlength="20">
            </div>
            <hr>
            <div class="form-group">
                <label>界面语言</label>
                <select name="language">
                    <option value="zh" {% if user.language == 'zh' %}selected{% endif %}>简体中文</option>
                    <option value="en" {% if user.language == 'en' %}selected{% endif %}>English</option>
                </select>
            </div>
            <div class="form-group">
                <label>主题</label>
                <select name="theme">
                    <option value="light" {% if user.theme == 'light' %}selected{% endif %}>浅色</option>
                    <option value="dark" {% if user.theme == 'dark' %}selected{% endif %}>深色</option>
                </select>
            </div>
            <div class="text-right mt-10">
                <button type="submit" class="btn">保存设置</button>
            </div>
        </form>
    </div>
</div>

<div class="section">
    <div class="section-title">📋 其他</div>
    <div class="section-body">
        <ul class="link-list">
            <li><a href="/home/my">我的家园</a></li>
            <li><a href="/home/gamelobby">游戏大厅</a></li>
            <li><a href="/auth/logout">退出登录</a></li>
        </ul>
    </div>
</div>
{% endblock %}
