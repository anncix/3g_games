<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>注册 - QQ家园</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            font-size: 14px;
            background: linear-gradient(180deg, #4a86e8 0%, #2a5caa 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: white;
            width: 100%;
            max-width: 360px;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .logo { text-align: center; font-size: 48px; margin-bottom: 10px; }
        .title {
            text-align: center; font-size: 20px; font-weight: bold;
            color: #2a5caa; margin-bottom: 5px;
        }
        .subtitle { text-align: center; font-size: 12px; color: #999; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block; margin-bottom: 4px; color: #333; font-size: 13px;
        }
        .form-group input {
            width: 100%; padding: 10px; border: 1px solid #ddd;
            border-radius: 4px; font-size: 14px; font-family: inherit;
        }
        .btn {
            width: 100%; padding: 10px;
            background: linear-gradient(180deg, #5a96e8 0%, #3a76c8 100%);
            color: white; border: none; border-radius: 4px;
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .btn:hover { background: linear-gradient(180deg, #4a86d8 0%, #2a66b8 100%); }
        .links { text-align: center; margin-top: 15px; font-size: 13px; }
        .links a { color: #1a5dc7; text-decoration: none; margin: 0 8px; }
        .error {
            background: #ffe8e8; color: #c83030; padding: 8px;
            border-radius: 4px; margin-bottom: 10px; font-size: 13px; text-align: center;
        }
        .footer {
            text-align: center; margin-top: 20px;
            color: rgba(255,255,255,0.7); font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🏠</div>
        <div class="title">注册账号</div>
        <div class="subtitle">加入QQ家园，重温旧时光</div>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="post" action="/auth/register">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="3-20个字符" required minlength="3" maxlength="20">
            </div>
            <div class="form-group">
                <label>昵称</label>
                <input type="text" name="nickname" placeholder="显示的昵称" maxlength="20">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="至少6位" required minlength="6">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" name="confirm_password" placeholder="再次输入密码" required minlength="6">
            </div>
            <button type="submit" class="btn">注 册</button>
        </form>
        
        <div class="links">
            <a href="/auth/login">已有账号？去登录</a>
        </div>
    </div>
    <div class="footer">
        QQ家园复刻版 · 致敬我们逝去的青春
    </div>
</body>
</html>
