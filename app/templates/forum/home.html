{% extends "base.html" %}
{% from "macros.html" import topbar, footer %}
{% block title %}论坛{% endblock %}
{% block body %}
{{ topbar("论坛", user) }}
<div class="section-title">板块</div>
<div class="content">
  {% for b in boards %}
  <a class="li" href="/forum/board/{{ b.id }}">{{ b.name }}<span class="r">{{ b.description }} ›</span></a>
  {% endfor %}
</div>
<div class="notice">论坛发帖5次可点亮“论坛达人”图标。家族贡献、论坛发帖都是平台行为点亮来源。</div>
{{ footer(user) }}
{% endblock %}
