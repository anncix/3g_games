{% extends "base.html" %}
{% from "macros.html" import topbar %}
{% block title %}注册{% endblock %}
{% block body %}
{{ topbar("注册账号", none) }}
<div class="content">
  <form method="post" action="/register">
    <div class="row"><label>账号(≥3位)</label><input type="text" name="username" required></div>
    <div class="row"><label>密码(≥4位)</label><input type="password" name="password" required></div>
    <div class="row"><label>昵称</label><input type="text" name="nickname"></div>
    <div class="row"><label>同城</label><input type="text" name="city" placeholder="如：北京"></div>
    <button class="btn" type="submit">注册并登录</button>
    <a class="btn ghost" href="/login">已有账号</a>
  </form>
</div>
{% endblock %}
