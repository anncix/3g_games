{% extends "base.html" %}
{% from "macros.html" import topbar, footer %}
{% block title %}设置{% endblock %}
{% block body %}
{{ topbar("设置", user) }}
<div class="section-title">隐私锁</div>
<div class="content">
  <form method="post" action="/settings/privacy">
    <div class="row"><label>谁能访问我主页</label>
      <select name="allow_visit"><option value="0">所有人</option><option value="1" {% if pl.allow_visit==1 %}selected{% endif %}>仅好友</option><option value="2" {% if pl.allow_visit==2 %}selected{% endif %}>无人</option></select>
    </div>
    <div class="row"><label>谁能给我留言</label>
      <select name="allow_guestbook"><option value="0">所有人</option><option value="1" {% if pl.allow_guestbook==1 %}selected{% endif %}>仅好友</option><option value="2" {% if pl.allow_guestbook==2 %}selected{% endif %}>无人</option></select>
    </div>
    <div class="row"><label>谁能私聊我</label>
      <select name="allow_chat"><option value="0">所有人</option><option value="1" {% if pl.allow_chat==1 %}selected{% endif %}>仅好友</option><option value="2" {% if pl.allow_chat==2 %}selected{% endif %}>无人</option></select>
    </div>
    <div class="row"><label><input type="checkbox" name="show_in_city" {% if pl.show_in_city %}checked{% endif %}> 在同城展示我</label></div>
    <button class="btn" type="submit">保存隐私锁</button>
  </form>
</div>
<div class="section-title">消息提醒开关</div>
<div class="content">
  <form method="post" action="/settings/notify">
    <label><input type="checkbox" name="notify_message" {% if s.notify_message %}checked{% endif %}> 系统消息</label><br>
    <label><input type="checkbox" name="notify_activity" {% if s.notify_activity %}checked{% endif %}> 活动提醒</label><br>
    <label><input type="checkbox" name="notify_interact" {% if s.notify_interact %}checked{% endif %}> 互动提醒</label><br>
    <button class="btn" type="submit">保存提醒</button>
  </form>
</div>
<div class="section-title">物品锁管理</div>
<div class="content"><a class="li" href="/settings/itemlocks">管理已上锁物品<span class="r">›</span></a></div>
<div class="section-title">黑名单</div>
<div class="content"><a class="li" href="/friends">管理黑名单<span class="r">›</span></a></div>
<div class="section-title">账号资料</div>
<div class="content">
  <form method="post" action="/settings/profile">
    <div class="row"><label>昵称</label><input type="text" name="nickname" value="{{ user.nickname }}"></div>
    <div class="row"><label>签名</label><input type="text" name="signature" value="{{ user.signature }}"></div>
    <div class="row"><label>同城</label><input type="text" name="city" value="{{ user.city }}"></div>
    <div class="row"><label>性别</label><select name="gender"><option value="0" {% if user.gender==0 %}selected{% endif %}>保密</option><option value="1" {% if user.gender==1 %}selected{% endif %}>男</option><option value="2" {% if user.gender==2 %}selected{% endif %}>女</option></select></div>
    <button class="btn" type="submit">保存资料</button>
  </form>
</div>
{{ footer(user) }}
{% endblock %}
