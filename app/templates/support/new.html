{% extends "base.html" %}
{% from "macros.html" import topbar, footer %}
{% block title %}提交工单{% endblock %}
{% block body %}
{{ topbar("提交工单", user) }}
<div class="crumb"><a href="/support">客服</a> › 提单</div>
<div class="content">
  <form method="post" action="/support/new">
    <div class="row"><label>问题分类</label>
      <select name="category">
        <option value="account">账号</option>
        <option value="currency">货币</option>
        <option value="item">物品</option>
        <option value="social">社交</option>
        <option value="module">模块</option>
      </select>
    </div>
    <div class="row"><label>标题</label><input type="text" name="title" required></div>
    <div class="row"><label>详细描述（含申诉）</label><textarea name="content" rows="6" required></textarea></div>
    <button class="btn green" type="submit">提交</button>
  </form>
</div>
{{ footer(user) }}
{% endblock %}
