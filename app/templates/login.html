{% extends "base.html" %}
{% from "macros.html" import topbar %}
{% block title %}登录{% endblock %}
{% block body %}
{{ topbar("登录家园", none) }}
<div class="content">
  <div class="card">
    <div class="hd">欢迎回家</div>
    <form method="post" action="/login">
      <div class="row"><label>账号</label><input type="text" name="username" placeholder="admin / demo"></div>
      <div class="row"><label>密码</label><input type="password" name="password" placeholder="admin123 / demo123"></div>
      <button class="btn" type="submit">登录</button>
      <a class="btn ghost" href="/register">注册</a>
    </form>
  </div>
  <div class="muted">提示：admin/admin123（站长） demo/demo123 lily/lily123</div>
</div>
{% endblock %}
